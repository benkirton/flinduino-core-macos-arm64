name: Support another PIC32 chip or board
description: Request or contribute support for a part other than PIC32MX250F128D
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Only PIC32MX250F128D is verified. The generator fixes are general, but
        the PPS base address in `pinmap/mx/mx1xx2xx` is correct for MX1xx/2xx
        only - other families need their own base. See docs/PORTING.md.

  - type: input
    id: part
    attributes:
      label: Which part?
      placeholder: e.g. PIC32MX470F512H
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Which board?
      placeholder: e.g. chipKIT uC32
    validations:
      required: true

  - type: checkboxes
    id: hardware
    attributes:
      label: Can you test on hardware?
      description: Changes cannot be verified without it.
      options:
        - label: I have the board and can test builds
